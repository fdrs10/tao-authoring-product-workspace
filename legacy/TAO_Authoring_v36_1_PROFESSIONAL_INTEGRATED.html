function roadmap(){let cats=roadCat==='all'?CATS:[roadCat],f=state.filters.road||{};let market=f.market||'All',mos=f.moscow||'All',vis=f.visibility||'All';let all=state.caps.filter(c=>roadVisible(c)&&(market==='All'||c.markets.includes(market))&&(mos==='All'||c.moscow===mos)&&(vis==='All'||c.visibility===vis));let h=`<div class="roadhead"><div><div class="eyebrow">ROADMAP · CANONICAL CAPABILITIES FROM IDEATION</div><h1>Authoring Roadmap</h1></div><div class="roadcontrols">${['category','bigrock','feature'].map(x=>`<button data-rlevel="${x}" class="${roadLevel===x?'active':''}">${x==='category'?'Categories':x==='bigrock'?'Big Rocks':'Features'}</button>`).join('')}</div></div><div class="roadfilters"><label>Market</label><select data-roadfilter="market"><option>All</option>${MARKETS.map(x=>`<option ${market===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>MoSCoW</label><select data-roadfilter="moscow">${['All','Must','Should','Could',"Won't"].map(x=>`<option ${mos===x?'selected':''}>${x}</option>`).join('')}</select><label>Visibility</label><select data-roadfilter="visibility">${['All','Shared / common core','Shared / market-configured','Market-specific','Customer-specific','Migration-only','Internal / platform'].map(x=>`<option ${vis===x?'selected':''}>${esc(x)}</option>`).join('')}</select><span style="width:10px"></span>${[['full','Full'],['0-6','0–6m'],['7-24','7–24m'],['tail','Tail']].map(x=>`<button data-rh="${x[0]}" class="${roadHorizon===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="roadsummary"><button data-rcat="all" class="${roadCat==='all'?'active':''}">All strategic categories<small>${all.length} capabilities in view</small></button>${CATS.map(c=>`<button data-rcat="${esc(c)}" style="--cc:${CATC[c]}" class="${roadCat===c?'active':''}">${esc(c)}<small>${all.filter(x=>x.category===c).length} capabilities</small></button>`).join('')}</div><div class="timeline"><div class="timehead"><div>Strategic Category</div><div>Big Rock / Market</div><div>Feature</div><div>${roadQuarterHead()}<div class="road-mslabels">${state.milestones.filter(m=>{const[st,n]=roadRange();return m.month>=st&&m.month<st+n}).map(m=>{const[st,n]=roadRange();return `<span class="road-mslabel" style="left:${((m.month-st)+.5)/n*100}%">${esc(m.name)}</span>`}).join('')}</div></div></div>`;
for(const cat of cats){let cs=all.filter(c=>c.category===cat);if(!cs.length)continue;if(roadLevel==='category'){h+=`<div class="rrow"><div class="catcell">${esc(cat)}</div><div></div><div>${cs.length} capabilities</div>${roadTrack(cs,cat)}</div>`;continue}let open=roadOpenCats.has(cat);h+=`<div class="r-cathead"><div class="catcell" style="border-left:5px solid ${CATC[cat]}">${esc(cat)} <button class="r-toggle" data-ropencat="${esc(cat)}">${open?'−':'+'}</button></div><div></div><div>${cs.length} capabilities</div>${roadTrack(cs,cat)}</div>`;if(!open)continue;for(const mk of MARKETS){let ms=cs.filter(c=>c.markets.includes(mk));if(!ms.length)continue;if(roadLevel==='bigrock'){h+=`<div class="rrow"><div></div><div class="rockcell"><i class="dot" style="background:${MC[mk]}"></i>${esc(mk)}</div><div>${ms.length} capabilities</div>${roadTrack(ms,cat)}</div>`}else{let key=cat+'|'+mk,mo=roadOpenMarkets.has(key);h+=`<div class="r-markethead"><div></div><div class="r-marketname"><i class="dot" style="background:${MC[mk]}"></i>${esc(mk)} <button class="r-toggle" data-ropenmarket="${esc(key)}">${mo?'−':'+'}</button></div><div>${ms.length} Features</div>${roadTrack(ms,cat)}</div>`;if(mo)for(const c of ms)h+=`<div class="rrow"><div></div><div></div><div class="featcell"><b>${c.id}</b> · ${esc(c.name)}<div class="qmeta">${esc(c.moscow)} · ${esc(c.visibility)}</div></div>${roadTrack([c],cat,c)}</div>`}}
}return h+'</div>'}
function openQuarter(qi){const qnames=['2026 Q4','2027 Q1','2027 Q2','2027 Q3','2027 Q4','2028 Q1','2028 Q2','2028 Q3','2028 Q4'],st=qi*3,en=st+3;let caps=state.caps.filter(c=>inRoadmap(c)&&(c.start||0)<en&&((c.start||0)+(c.dur||1))>st);let html=`<div class="quarter-report-head"><div><h2>${qnames[qi]} · Authoring Roadmap</h2><p>Quarter working view · ${caps.length} capabilities active in this period</p></div><button id="closeQuarter">×</button></div><table class="qtable"><thead><tr><th>Strategic Category</th><th>Market</th><th>Capability</th><th>MoSCoW</th><th>Visibility</th><th>Timing</th></tr></thead><tbody>`;for(const c of caps.sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.name.localeCompare(b.name)))html+=`<tr><td><b>${esc(c.category)}</b></td><td>${marketDots(c.markets)}</td><td><div class="qname">${c.id} · ${esc(c.name)}</div><div class="qmeta">${esc(c.description)}</div></td><td>${esc(c.moscow)}</td><td>${esc(c.visibility)}</td><td>M${c.start||0} → M${(c.start||0)+(c.dur||1)-1}</td></tr>`;html+='</tbody></table>';document.getElementById('quarterReport').innerHTML=html;document.getElementById('quarterModal').classList.add('show');document.getElementById('closeQuarter').onclick=()=>document.getElementById('quarterModal').classList.remove('show')}
function inRoadmap(c){return !['Discontinue','Reject'].includes(c.decision)}
function roadRow(cat,mk,feat,items,cc,one){let s=Math.min(...items.map(x=>x.start||0)),e=Math.max(...items.map(x=>(x.start||0)+(x.dur||1)));let bars=one?[one]:[{name:items.length+' capabilities',start:s,dur:e-s,id:'',category:cat}];return `<div class="rrow"><div class="catcell">${esc(cat)}</div><div class="rockcell">${mk?`<i class="dot" style="background:${MC[mk]}"></i>${esc(mk)}`:''}</div><div class="featcell">${esc(feat)}</div><div class="track">${state.milestones.map(m=>`<div class="milestone" style="left:${(m.month+.5)/27*100}%"><span>${esc(m.name)}</span></div>`).join('')}${bars.map(b=>`<div class="bar" data-bar="${b.id||''}" style="left:${(b.start||0)/27*100}%;width:${(b.dur||1)/27*100}%;background:${CATC[cc]}"><span class="handle left"></span>${esc(b.name)}<span class="handle right"></span></div>`).join('')}</div></div>`}
function migration(){let ms=state.milestones;let h=`<div class="eyebrow">MIGRATION PATH · ROADMAP GATES + CUSTOMER READINESS</div><h1>3.x → transition states → Target Authoring</h1><div class="miglegend">${MARKETS.map(m=>`<span><i class="dot" style="background:${MC[m]}"></i>${esc(m)}</span>`).join('')}</div><div class="miggrid"><div class="bands"><div class="bandlabel">TAO 3.x AUTHORING<br><small>dependency decreases ↓</small></div><div class="bandlabel" style="position:absolute;bottom:12px">TAO STUDIO AUTHORING<br><small>capability & value increases ↓</small></div><div class="wedge red"></div><div class="wedge blue"></div></div><div class="migmain">`;for(let i=0;i<ms.length;i++){let m=ms[i],prev=i?ms[i-1].month:-1;let caps=state.caps.filter(c=>inRoadmap(c)&&(c.start||0)>prev&&(c.start||0)<=m.month);let ts='TS'+Math.min(3,i+1),cust=state.customers.filter(c=>c.transition===ts);h+=`<div class="gate"><div class="gatehead"><span>${m.id} · ${esc(m.name)}</span><span class="gatedate">${esc(m.date)}</span></div></div><div class="segment"><div class="segbox"><h4>Value / capabilities unlocked</h4>${caps.slice(0,14).map(c=>`<span class="chip" style="--mc:${MC[c.markets[0]]||CATC[c.category]}"><b>${c.id}</b> · ${esc(c.name)} ${marketDots(c.markets)}</span>`).join('')||'<span class="chip" style="--mc:#9aa">No capabilities assigned yet</span>'}</div><div class="segbox"><h4>Customers ready to move · ${esc(m.name)}</h4>${cust.map(c=>`<span class="chip" style="--mc:#5d7890">${esc(c.name)} <small>· ${ts}</small></span>`).join('')||'<span class="chip" style="--mc:#9aa">Add / validate customers for this gate</span>'}</div></div>`}h+=`</div><div class="customers"><h3 style="margin-top:0">Customer transition projects</h3><div class="qmeta" style="margin-bottom:8px">Each customer is tied to an earliest viable transition state and therefore to a roadmap gate.</div>${state.customers.map(c=>{let n=+String(c.transition||'TS1').replace(/\D/g,'')||1,mi=Math.min(ms.length-1,Math.max(0,n));let gm=ms[mi]||ms[0];return `<div class="cust"><button data-cust="${c.id}">✎</button><b>${esc(c.name)}</b><small>Uses today: ${esc(c.today||'—')}</small><small>Expected in Studio: ${esc(c.expected||'—')}</small><small>Earliest transition: ${esc(c.transition||'—')}</small><span class="custgate">Roadmap gate: ${gm?esc(gm.id+' · '+gm.name+' · '+gm.date):'—'}</span></div>`}).join('')}<button class="custadd" id="addCust">+ Add customer</button></div></div>`;return h}
function render(){document.getElementById('ideaMenu').innerHTML=ideaMenu();document.getElementById('ideaBtn').classList.toggle('active',area==='idea');document.getElementById('roadBtn').classList.toggle('active',area==='road');document.getElementById('migBtn').classList.toggle('active',area==='mig');document.getElementById('app').innerHTML=area==='idea'?(view==='overview'?slide1():sheet(view)):area==='road'?roadmap():migration();bind()}
function bind(){document.querySelectorAll('[data-open],[data-iview]').forEach(b=>b.onclick=()=>{area='idea';view=b.dataset.open||b.dataset.iview;document.getElementById('ideawrap').classList.remove('open');render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{let k=b.dataset.cat;state.collapsed[k]=!state.collapsed[k];save();render()});document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{state.filters[view]=state.filters[view]||{};state.filters[view].market=b.dataset.market;save();render()});document.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{state.filters[view]=state.filters[view]||{};state.filters[view][e.dataset.filter]=e.value;save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCap(b.dataset.edit));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCap(b.dataset.add));document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveCap(b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveCap(b.dataset.down,1));document.querySelectorAll('[data-rlevel]').forEach(b=>b.onclick=()=>{roadLevel=b.dataset.rlevel;render()});document.querySelectorAll('[data-rcat]').forEach(b=>b.onclick=()=>{roadCat=b.dataset.rcat;render()});document.querySelectorAll('[data-roadfilter]').forEach(e=>e.onchange=()=>{state.filters.road=state.filters.road||{};state.filters.road[e.dataset.roadfilter]=e.value;save();render()});document.querySelectorAll('[data-rh]').forEach(b=>b.onclick=()=>{roadHorizon=b.dataset.rh;render()});document.querySelectorAll('[data-ropencat]').forEach(b=>b.onclick=()=>{let k=b.dataset.ropencat;roadOpenCats.has(k)?roadOpenCats.delete(k):roadOpenCats.add(k);render()});document.querySelectorAll('[data-ropenmarket]').forEach(b=>b.onclick=()=>{let k=b.dataset.ropenmarket;roadOpenMarkets.has(k)?roadOpenMarkets.delete(k):roadOpenMarkets.add(k);render()});document.querySelectorAll('[data-quarter]').forEach(b=>b.onclick=()=>openQuarter(+b.dataset.quarter));attachBars();document.querySelectorAll('[data-cust]').forEach(b=>b.onclick=()=>openCust(b.dataset.cust));document.getElementById('addCust')?.addEventListener('click',()=>openCust(null))}
function attachBars(){document.querySelectorAll('.bar[data-bar]').forEach(el=>{let id=el.dataset.bar;if(!id)return;let sx,start,dur,mode,moved=false;el.onpointerdown=e=>{let c=state.caps.find(x=>x.id===id);if(!c)return;sx=e.clientX;start=c.start||0;dur=c.dur||1;mode=e.target.classList.contains('left')?'left':e.target.classList.contains('right')?'right':'move';moved=false;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;let rect=el.parentElement.getBoundingClientRect(),d=Math.round((e.clientX-sx)/(rect.width/27)),c=state.caps.find(x=>x.id===id);if(!c)return;if(d)moved=true;if(mode==='move'){c.start=Math.max(0,Math.min(27-dur,start+d));c.dur=dur}else if(mode==='left'){let ns=Math.max(0,Math.min(start+dur-1,start+d));c.start=ns;c.dur=start+dur-ns}else c.dur=Math.max(1,Math.min(27-start,dur+d));el.style.left=c.start/27*100+'%';el.style.width=c.dur/27*100+'%'};el.onpointerup=e=>{if(moved){save();render()}}})}
function moveCap(id,d){let i=state.caps.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=state.caps.length)return;[state.caps[i],state.caps[j]]=[state.caps[j],state.caps[i]];save();render()}
function openCap(id){editing=id;editType='cap';let c=state.caps.find(x=>x.id===id);document.getElementById('mtitle').textContent='Edit '+id;capFields(c);document.getElementById('modal').classList.add('show')}
function addCap(v){editing=null;editType='cap';let n=Math.max(0,...state.caps.map(c=>+c.id.replace(/\D/g,'')||0))+1,c={id:'CAP-'+String(n).padStart(3,'0'),name:'',category:CATS[0],markets:[],origin:v==='3x'?'3x':v==='v1'?'v1':'new',moscow:'Should',visibility:'Shared / market-configured',scope:'V2 candidate',description:'',source:'',v2:'',notes:'',decision:decisions[v]?.[0]||'',start:6,dur:6};document.getElementById('mtitle').textContent='Add capability';capFields(c);document.getElementById('form').dataset.new=JSON.stringify(c);document.getElementById('modal').classList.add('show')}
function capFields(c){document.getElementById('fields').innerHTML=`<div class="field"><label>ID</label><input id="fId" value="${esc(c.id)}"></div><div class="field"><label>Strategic Category</label><select id="fCat">${CATS.map(x=>`<option ${x===c.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Capability / Feature</label><input id="fName" value="${esc(c.name)}"></div><div class="field full"><label>Short functional explanation</label><textarea id="fDesc">${esc(c.description)}</textarea></div><div class="field"><label>MoSCoW</label><select id="fMos">${['Must','Should','Could',"Won't"].map(x=>`<option ${x===c.moscow?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select id="fVis">${['Shared / common core','Shared / market-configured','Market-specific','Customer-specific','Migration-only','Internal / platform'].map(x=>`<option ${x===c.visibility?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Scope</label><input id="fScope" value="${esc(c.scope)}"></div><div class="field"><label>Decision / Classification</label><select id="fDec">${[...new Set(Object.values(decisions).flat())].map(x=>`<option ${x===c.decision?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Markets</label><div class="checks">${MARKETS.map(m=>`<label><input type="checkbox" name="mk" value="${esc(m)}" ${c.markets.includes(m)?'checked':''}><i class="dot" style="background:${MC[m]}"></i>${m}</label>`).join('')}</div></div><div class="field"><label>Origin</label><select id="fOrigin">${['v1','3x','new','cross','disc'].map(x=>`<option ${x===c.origin?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>V2 mapping</label><input id="fV2" value="${esc(c.v2)}"></div><div class="field"><label>Roadmap start month (0–26)</label><input id="fStart" type="number" min="0" max="26" value="${c.start||0}"></div><div class="field"><label>Duration months</label><input id="fDur" type="number" min="1" max="27" value="${c.dur||1}"></div><div class="field full"><label>Evidence / Source</label><input id="fSource" value="${esc(c.source)}"></div><div class="field full"><label>Notes</label><textarea id="fNotes">${esc(c.notes)}</textarea></div>`}
function openCust(id){editType='cust';editing=id;let c=id?state.customers.find(x=>x.id===id):{id:'CUS-'+String(state.customers.length+1).padStart(3,'0'),name:'',today:'',expected:'',transition:'TS1',notes:''};document.getElementById('mtitle').textContent=id?'Edit customer':'Add customer';document.getElementById('fields').innerHTML=`<div class="field"><label>ID</label><input id="cId" value="${esc(c.id)}"></div><div class="field"><label>Customer name</label><input id="cName" value="${esc(c.name)}"></div><div class="field full"><label>Minimum functionality used today</label><textarea id="cToday">${esc(c.today)}</textarea></div><div class="field full"><label>Minimum functionality expected in Studio</label><textarea id="cExpected">${esc(c.expected)}</textarea></div><div class="field"><label>Earliest viable transition</label><select id="cTrans">${['TS1','TS2','TS3'].map(x=>`<option ${x===c.transition?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Notes / blockers / validation</label><textarea id="cNotes">${esc(c.notes)}</textarea></div>`;document.getElementById('form').dataset.new=JSON.stringify(c);document.getElementById('modal').classList.add('show')}
document.getElementById('ideaBtn').onclick=()=>document.getElementById('ideawrap').classList.toggle('open');document.getElementById('roadBtn').onclick=()=>{area='road';render()};document.getElementById('migBtn').onclick=()=>{area='mig';render()};document.addEventListener('click',e=>{if(!e.target.closest('#ideawrap'))document.getElementById('ideawrap').classList.remove('open')});document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('form').onsubmit=e=>{e.preventDefault();if(editType==='cap'){let c=editing?state.caps.find(x=>x.id===editing):JSON.parse(e.currentTarget.dataset.new);c.id=fId.value.trim();c.category=fCat.value;c.name=fName.value.trim();c.description=fDesc.value.trim();c.moscow=fMos.value;c.visibility=fVis.value;c.scope=fScope.value.trim();c.decision=fDec.value;c.markets=[...document.querySelectorAll('input[name=mk]:checked')].map(x=>x.value);c.origin=fOrigin.value;c.v2=fV2.value.trim();c.start=Math.max(0,Math.min(26,+fStart.value||0));c.dur=Math.max(1,Math.min(27-c.start,+fDur.value||1));c.source=fSource.value.trim();c.notes=fNotes.value.trim();if(!editing)state.caps.push(c)}else{let c=editing?state.customers.find(x=>x.id===editing):JSON.parse(e.currentTarget.dataset.new);c.id=cId.value.trim();c.name=cName.value.trim();c.today=cToday.value.trim();c.expected=cExpected.value.trim();c.transition=cTrans.value;c.notes=cNotes.value.trim();if(!editing)state.customers.push(c)}save();document.getElementById('modal').classList.remove('show');render()};render();
</script></body></html>
